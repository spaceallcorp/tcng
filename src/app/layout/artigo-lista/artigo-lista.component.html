<div class="uk-container articles-list-container">
  @if (posts$ | async; as posts) {
    <div class="uk-grid uk-child-width-1-3@m uk-child-width-1-2@s uk-grid-match uk-grid-medium" uk-grid>
      @for (post of posts; track post.id) {
        <div>
          <article class="solution-article-card">
            @if (post.imageUrl) {
              <div class="solution-card-media">
                <img [src]="post.imageUrl" [alt]="post.title" class="solution-card-img" />
                <div class="solution-card-overlay"></div>
                <span class="solution-card-tag">Solution</span>
              </div>
            }

            <div class="solution-card-body">
              <a [routerLink]="['/solution', post.id]" class="solution-card-link">
                <h3 class="solution-card-title">{{ post.title }}</h3>
              </a>
              
              <div class="solution-card-footer">
                <a [routerLink]="['/solution', post.id]" class="btn-read-solution">
                  <span>Explore Solution</span>
                  <span uk-icon="icon: arrow-right; ratio: 0.85" class="read-icon"></span>
                </a>
              </div>
            </div>
          </article>
        </div>
      }
    </div>
  } @else {
    <div class="loading-state-wrapper">
      <div class="solution-spinner"></div>
      <p class="loading-label">Loading solutions...</p>
    </div>
  }
</div>
